name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketlar
        run: flutter pub get

      - name: Tahlil
        run: flutter analyze

      - name: Unit testlar (SRS, import, zaxira)
        run: flutter test test/

      - name: APK (release)
        run: flutter build apk --release

      - name: INTERNET ruxsati yo'qligini tekshirish
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          if $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -q "android.permission.INTERNET"; then
            echo "XATO: APK da INTERNET ruxsati bor"; exit 1
          fi
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk

      - name: Nomlash
        run: cp build/app/outputs/flutter-apk/app-release.apk sozlik-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sozlik-apk
          path: sozlik-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sozlik-*.apk
          generate_release_notes: true
