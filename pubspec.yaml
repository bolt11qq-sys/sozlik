name: sozlik
description: "So'zlik — ingliz tili so'zlarini takrorlash jadvali bo'yicha yodlash ilovasi. Oflayn."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  file_picker: ^13.1.0
  flutter_svg: ^2.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
